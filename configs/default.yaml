model:
  name_or_path: Qwen/Qwen3-8B
  key: qwen3-8b
  device: cuda
extractor:
  checkpoint: checkpoints/extractor_qwen3_8b.pkl
  mode: contrastive
  stories_path: data/emotion_stories/stories.json
  goemotions_validation: data/goemotions/validation.json
  goemotions_test: data/goemotions/test.json
  pca_components: 10
  n_neutral: 100
encoder:
  checkpoint: checkpoints/encoder_qwen3_8b.pt
  tau: 0.3
training:
  warmup_episodes_per_env: 250
  epochs: 50
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  patience: 5
  seed: 42
evolution:
  enabled: true
  rounds: 3
  eta: 0.4
  window: 100
  episode_per_round: 50
evaluation:
  env: webshop
  method: Emotion2Skill
  ablation: full
  split: test
  n_episodes: null
  n_runs: 3
  seed: 42
  mock: false
  max_steps: null
  mbpp_timeout: 5.0
  evaluate_each_round: false
datasets:
  webshop:
    manifest: manifests/webshop.json
  alfworld:
    manifest: manifests/alfworld.json
    data_path: data/alfworld
  math:
    manifest: manifests/math.json
  mbpp:
    manifest: manifests/mbpp.json
logging:
  results_dir: results
